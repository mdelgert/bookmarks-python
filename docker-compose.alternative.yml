services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/bookmarks.db
      - LOG_LEVEL=INFO
      - STATUS_CHECK_TIMEOUT=10
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped