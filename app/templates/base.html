<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Bookmarks{% endblock %}</title>

  <!-- Bootstrap 5 dark -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />

  <!-- Material Design Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" />

  <!-- Custom dark styles -->
  <link rel="stylesheet" href="/static/css/style.css" />

  {% block head %}{% endblock %}
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/">
      <i class="mdi mdi-bookmark-multiple me-1 text-primary"></i>Bookmarks
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.url.path == '/' %}active{% endif %}" href="/">
            <i class="mdi mdi-home me-1"></i>Home
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.url.path.startswith('/bookmarks') %}active{% endif %}" href="/bookmarks">
            <i class="mdi mdi-pencil me-1"></i>Edit Bookmarks
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Main content -->
<main class="container-fluid py-4">
  {% block content %}{% endblock %}
</main>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- HTMX -->
<script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>

<!-- App JS -->
<script src="/static/js/main.js"></script>

{% block scripts %}{% endblock %}
</body>
</html>
